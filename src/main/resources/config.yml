defaults:
  # Available values:
  # - ACTION_BAR
  # - BOSS_BAR
  # - CHAT
  # - TITLE
  # - SCOREBOARD
  # - DIALOG  (requires Paper 1.21.7+)
  display-types:
    - ACTION_BAR
  update-interval: 1
  # Visibility controls who can see countdowns by default.
  # Available values:
  # - "all"         -> visible to everyone
  # - "<permission>" -> require a permission node (e.g. "ezcountdown.use") to view
  # If set to "all", display visibility checks are disabled. If set to a permission string,
  # only players with that permission will see countdown displays by default.
  visibility: "all"
  start-on-create: true
  zone: "UTC"

permissions:
  base: "ezcountdown.use"
  create: "ezcountdown.admin"
  start: "ezcountdown.admin"
  stop: "ezcountdown.admin"
  delete: "ezcountdown.admin"
  list: "ezcountdown.use"
  info: "ezcountdown.use"
  reload: "ezcountdown.admin"

display:
  refresh:
    # How often the bossbar progress bar and title are refreshed, in ticks (20 ticks = 1 second).
    # Lower values produce smoother animation. Minimum is 1.
    bossbar-ticks: 1
    # How often the scoreboard sidebar is refreshed, in ticks. Minimum is 1.
    scoreboard-ticks: 1
  time-format:
    # Template used for the {formatted} / %ezcountdown_<name>_formatted% placeholder.
    # Supported tokens: {days}, {hours}, {minutes}, {seconds}
    pattern: "{days}d {hours}h {minutes}m {seconds}s"
    # When true, leading units whose value is 0 are hidden.
    # Example: 0d 2h 5m 3s becomes  2h 5m 3s
    hide-leading-zeros: true

display-overrides:
  # Set to true to force-enable a display type even if runtime checks fail.
  force-enable:
    action_bar: false
    chat: false
    title: false
    scoreboard: false
    boss_bar: false
    dialog: false

# Enable verbose debug logging for diagnosing countdown lifecycle events.
# When true, the server console will log each countdown create, start, stop, delete,
# tick expiry, debounce suppression, start/end broadcast, and message dispatch.
# Leave false in production; reload is not required — the flag is applied on next /countdown reload.
debug: false
